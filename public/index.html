<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F1115" />
  <title>Taskflow - Organize sem complicar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="preloader" style="position:fixed;inset:0;background:#0F1115;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .5s ease,visibility .5s ease"><div style="width:200px;height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden"><span id="preloader-bar" style="display:block;height:100%;width:0%;background:linear-gradient(90deg,#E85D04,#2563EB)"></span></div><div style="font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#9CA3AF">Carregando</div></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">T</div>
        <div class="brand-copy">
          <strong>taskflow</strong>
          <span>organize sem complicar</span>
        </div>
      </div>

      <button class="workspace-switcher" id="workspace-switcher" type="button">
        <span class="workspace-avatar">P</span>
        <span class="workspace-copy">
          <small>Workspace</small>
          <strong id="workspace-name">Meu workspace</strong>
        </span>
        <span class="workspace-chevron" data-icon="chevron-down"></span>
      </button>

      <nav class="primary-nav" aria-label="Navegação principal">
        <span class="nav-caption">Workspace</span>
        <button class="nav-item active" data-view="dashboard" type="button">
          <span class="nav-item-icon" data-icon="layout-dashboard"></span>
          <span>Visão geral</span>
        </button>
        <button class="nav-item" data-view="projects" type="button">
          <span class="nav-item-icon" data-icon="folder"></span>
          <span>Projetos</span>
          <span class="nav-count" id="project-count">0</span>
        </button>
        <button class="nav-item" data-view="my-tasks" type="button">
          <span class="nav-item-icon" data-icon="check-square"></span>
          <span>Minhas tarefas</span>
        </button>
        <button class="nav-item" data-view="calendar" type="button">
          <span class="nav-item-icon" data-icon="calendar"></span>
          <span>Calendário</span>
        </button>
        <button class="nav-item" data-view="notes" type="button">
          <span class="nav-item-icon" data-icon="sticky-note"></span>
          <span>Notas</span>
          <span class="nav-count" id="notes-count">0</span>
        </button>
      </nav>

      <div class="sidebar-projects">
        <div class="sidebar-section-heading">
          <span class="nav-caption">Seus projetos</span>
          <button class="tiny-button" data-action="new-project" type="button" aria-label="Criar projeto">+</button>
        </div>
        <div id="project-nav"></div>
      </div>

      <div class="sidebar-bottom">
        <button class="nav-item" data-view="settings" type="button">
          <span class="nav-item-icon" data-icon="settings"></span>
          <span>Configurações</span>
        </button>
        <div class="sidebar-user">
          <span class="avatar avatar-sidebar" id="sidebar-avatar">K</span>
          <span class="sidebar-user-copy">
            <strong id="sidebar-user-name">Kevin</strong>
            <small id="sidebar-user-email">kevin@taskflow.local</small>
          </span>
          <button class="icon-button sidebar-more" data-action="user-menu" type="button" aria-label="Mais opções"><span data-icon="more-horizontal"></span></button>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-content">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menu-button" type="button" aria-label="Abrir menu"><span data-icon="menu"></span></button>
        <div class="page-heading">
          <span class="page-eyebrow" id="page-eyebrow">Seu espaço de trabalho</span>
          <h1 id="page-title">Visão geral</h1>
        </div>
        <div class="topbar-actions">
          <button class="search-trigger" id="search-trigger" type="button">
            <span data-icon="search"></span>
            <span class="search-trigger-label">Buscar tarefas...</span>
            <kbd>⌘ K</kbd>
          </button>
          <button class="icon-button theme-button" id="theme-button" type="button" aria-label="Alternar tema"><span data-icon="sun-moon"></span></button>
          <button class="icon-button notification-button" id="notification-button" type="button" aria-label="Notificações"><span data-icon="bell"></span><i></i></button>
          <button class="topbar-user" id="topbar-user" type="button">
            <span class="avatar avatar-topbar" id="topbar-avatar">K</span>
            <span class="topbar-user-name" id="topbar-user-name">Kevin</span>
            <span data-icon="chevron-down"></span>
          </button>
        </div>
      </header>
      <div class="content-area" id="app-content">
        <div class="loading-state">
          <span class="loading-spinner"></span>
          <p>Carregando seu workspace...</p>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-root" id="modal-root"></div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <a class="whatsapp-float" href="https://wa.me/5511999999999" target="_blank" rel="noopener" aria-label="WhatsApp" style="position:fixed;bottom:24px;right:24px;z-index:1200;width:56px;height:56px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 10px 30px rgba(37,211,102,.4)"><svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></a>
  <script>
    (function(){var b=document.getElementById('preloader-bar');var p=0;var iv=setInterval(function(){p+=Math.random()*20+10;if(p>=100){p=100;clearInterval(iv);setTimeout(function(){var el=document.getElementById('preloader');el.style.opacity='0';el.style.visibility='hidden';},200);}b.style.width=p+'%';},100);})();
  </script>
  <script src="js/app.js"></script>
</body>
</html>
